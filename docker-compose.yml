name: cinepass

x-observabilidade: &observabilidade
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  LOGSTASH_HOST: logstash
  EUREKA_URL: http://discovery-server:8761/eureka/

services:
  # ---------------------------------------------------------------- Kafka (KRaft)
  kafka:
    image: apache/kafka:4.2.1
    container_name: cinepass-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são criados explicitamente (kafka-init), com o número de
      # partições definido; a auto-criação os criaria com 1 partição só.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 40s
      retries: 20
      start_period: 20s

  # Cria o tópico de eventos da reserva (6 partições) e os dead-letter topics.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: cinepass-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in reserva.eventos:6 reserva.eventos.notificacao.dlt:3 reserva.eventos.fidelidade.dlt:3 reserva.eventos.auditoria.dlt:3; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cinepass-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinepass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------- Banco
  postgres:
    image: postgres:17-alpine
    container_name: cinepass-postgres
    # 7 serviços com pool Hikari (10 conexões cada) + os pools do Temporal
    # passam do limite padrão de 100 conexões do PostgreSQL.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: cinepass
      POSTGRES_PASSWORD: cinepass
      POSTGRES_DB: postgres
    # Porta 25432 no host: é o padrão do DB_URL de todos os serviços, para rodar
    # as aplicações pela IDE contra este mesmo PostgreSQL.
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepass -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- Temporal (orquestração da Saga)
  # O reserva-service registra workers do Temporal na inicialização, então o
  # servidor precisa estar no ar. Usa o mesmo PostgreSQL (bancos próprios).
  temporal:
    image: temporalio/auto-setup:latest
    container_name: cinepass-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cinepass
      POSTGRES_PWD: cinepass
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    container_name: cinepass-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "28081:8080"

  # ---------------------------------------------------------------- Observabilidade
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: cinepass-zipkin
    ports:
      - "9411:9411"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cinepass-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: cinepass-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "5000:5000"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: cinepass-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # Ambiente local de demonstração: sem telemetria e sem o aviso de cluster sem segurança.
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      SECURITY_SHOWINSECURECLUSTERWARNING: "false"

  # ---------------------------------------------------------------- Aplicações
  discovery-server:
    build: ./discovery-server
    container_name: cinepass-discovery
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      LOGSTASH_HOST: logstash

  pagamento-service:
    build: ./pagamento-service
    container_name: cinepass-pagamento
    ports:
      - "8082:8082"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/pagamento_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  ingresso-service:
    build: ./ingresso-service
    container_name: cinepass-ingresso
    ports:
      - "8083:8083"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/ingresso_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  reserva-service:
    build: ./reserva-service
    container_name: cinepass-reserva
    ports:
      - "8081:8081"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/cinepass_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TEMPORAL_ADDRESS: temporal:7233
    # O auto-setup do Temporal leva alguns segundos para aceitar conexões:
    # se o reserva-service subir antes, ele reinicia até conseguir.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      discovery-server:
        condition: service_started
      pagamento-service:
        condition: service_started
      ingresso-service:
        condition: service_started

  notificacao-service:
    build: ./notificacao-service
    container_name: cinepass-notificacao
    ports:
      - "8084:8084"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/notificacao_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started

  fidelidade-service:
    build: ./fidelidade-service
    container_name: cinepass-fidelidade
    ports:
      - "8085:8085"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/fidelidade_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started

  auditoria-service:
    build: ./auditoria-service
    container_name: cinepass-auditoria
    ports:
      - "8086:8086"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/auditoria_db
      DB_USERNAME: cinepass
      DB_PASSWORD: cinepass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: cinepass-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *observabilidade
      SERVER_PORT: 8080
    depends_on:
      discovery-server:
        condition: service_started
      reserva-service:
        condition: service_started

volumes:
  postgres-data:
