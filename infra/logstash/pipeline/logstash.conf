# Centralização de logs do CinePass.
# Cada microsserviço envia seus logs já em JSON (Logback + logstash-logback-encoder)
# por TCP. O Logstash só grava em um índice diário do Elasticsearch; os campos
# (service, correlationId, reservaId, eventId, eventType, traceId, spanId...) já
# chegam estruturados e podem ser pesquisados no Kibana.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cinepass-logs-%{+YYYY.MM.dd}"
  }
}
