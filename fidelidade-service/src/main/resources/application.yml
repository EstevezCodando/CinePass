server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: fidelidade-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/fidelidade_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
    hikari:
      # Falha rápido se o banco cair: a mensagem vai para retry/DLT em segundos.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    template:
      observation-enabled: true

cinepass:
  kafka:
    topics:
      reserva-eventos: reserva.eventos
      dlt: reserva.eventos.fidelidade.dlt
    listener:
      concorrencia: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} reservaId=%X{reservaId:-} eventId=%X{eventId:-} thread=%thread logger=%logger{36} - %msg%n"
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5000}
