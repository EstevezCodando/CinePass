name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Actions em versões que já rodam em Node.js 24 e runner fixo (ubuntu-24.04):
# evita os avisos de depreciação do Node 20 e da migração do ubuntu-latest.
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O pom da raiz é só agregador: compila e testa todos os serviços.
      # Os testes de integração usam Testcontainers (PostgreSQL + Kafka), que
      # dependem do Docker já disponível nos runners do GitHub Actions.
      - name: Compilar e testar todos os serviços
        run: mvn -B -ntp verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore

  validar-docker-compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validar docker-compose.yml
        run: docker compose config -q
