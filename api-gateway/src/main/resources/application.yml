server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  reactor:
    # Restaura o contexto de tracing (MDC) nas threads do Reactor.
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: reserva-service
              uri: lb://RESERVA-SERVICE
              predicates:
                - Path=/api/reservas/**,/api/filmes/**,/api/sessoes/**
            - id: pagamento-service
              uri: lb://PAGAMENTO-SERVICE
              predicates:
                - Path=/api/pagamentos/**
            - id: ingresso-service
              uri: lb://INGRESSO-SERVICE
              predicates:
                - Path=/api/ingressos/**
            - id: notificacao-service
              uri: lb://NOTIFICACAO-SERVICE
              predicates:
                - Path=/api/notificacoes/**
            - id: fidelidade-service
              uri: lb://FIDELIDADE-SERVICE
              predicates:
                - Path=/api/fidelidade/**
            - id: auditoria-service
              uri: lb://AUDITORIA-SERVICE
              predicates:
                - Path=/api/auditoria/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} - %msg%n"
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5000}
